name: Main Foodgram workflow

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram
          POSTGRES_DB: foodgram_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install ruff==0.8.0
        pip install -r ./backend/requirements.txt
    - name: Lint with ruff
      env:
        POSTGRES_USER: kittygram_user
        POSTGRES_PASSWORD: kittygram
        POSTGRES_DB: kittygram_db
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        python -m ruff check backend/

  # Образы для прода в Docker Hub: <DOCKERHUB_USERNAME>/foodgram-backend и foodgram-gateway.
  # Не ghcr: с прод-сервера (Россия) ghcr качается очень медленно.
  build_and_push_images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        include:
          - image: foodgram-backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: foodgram-gateway
            context: .
            file: ./gateway/Dockerfile
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Сообщаем портфолио, что вышли новые образы: оно передеплоит сервер.
  # Токен: fine-grained PAT с Contents: read and write только на репо portfolio.
  trigger_portfolio_deploy:
    name: Trigger portfolio deploy
    runs-on: ubuntu-latest
    needs: build_and_push_images
    steps:
      - name: Send repository_dispatch
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN не задан, деплой не запущен"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HollowKaeden/portfolio/dispatches \
            -d '{"event_type":"deploy","client_payload":{"source":"foodgram","sha":"${{ github.sha }}"}}'
          echo "Деплой портфолио запущен"
