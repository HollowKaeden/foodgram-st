# За основу взят nginx/nginx.conf. Перед шлюзом стоит Caddy (HTTPS), он единственный, кто сюда ходит,
# поэтому его X-Forwarded-* передаются бэкенду как есть: по ним Django строит https-ссылки,
# а DRF определяет IP клиента для троттлинга (NUM_PROXIES=1).
server {
  listen 80;
  server_tokens off;
  # Картинки приходят base64 внутри JSON: файл 5 МБ даёт тело около 7 МБ.
  client_max_body_size 10M;
  root /usr/share/nginx/html;
  index index.html;

  location /media/ {
    alias /media/;
  }

  location ~ ^/(api|admin|s)/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_pass http://foodgram-backend:8000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
